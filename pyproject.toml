[project]
name = "empirical-evidence"
version = "0.1.0"
description = "A local Try -> Check -> Reward -> Nudge loop (CUDA, with an optional MLX/Apple-Silicon backend) that enforces a story in the pokemon-kafka agent."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7",
    "transformers>=4.45",
    "peft>=0.13",
    "trl>=0.12",
    "accelerate>=1.0",
    "datasets>=3.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pyboy==2.7.0",
    "pillow>=12.2.0",
    "numpy>=2.1",
    "safetensors>=0.8",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Apple-Silicon backend (AUTOTUNE_BACKEND=mlx). Not installable on Linux/CUDA;
# install with `uv sync --extra mac` on an M-series Mac.
mac = [
    "mlx-lm>=0.21",
]

# The tetris benchmark, imported for its prompt renderer and grader so training
# inputs are byte-identical to inference inputs. Sibling checkout, like pokemon-kafka.
tetris = [
    "tetris-agent",
]

# Local packaging on the 5090: llama.cpp's convert_hf_to_gguf.py reads the Gemma
# tokenizer through sentencepiece/protobuf. gguf itself comes from the checkout's
# gguf-py (LLAMA_CPP_DIR), matching the converter's version exactly.
package = [
    "sentencepiece>=0.2",
    "protobuf>=4",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "ipython",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autotune"]

# Blackwell (sm_120) needs PyTorch built for CUDA 12.8+. Pull torch from the cu128
# index; mirrors ../overdub's proven setup on this RTX 5090.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
# Pinned to the tetris commit that added the board to placement_graded (tetris #18),
# so the corpus builder imports exactly the prompt code that produced the rows, on any
# machine, with no sibling checkout to keep in sync. For local sibling development swap
# in `{ path = "../tetris", editable = true }` and relock.
tetris-agent = { git = "https://github.com/pcc-labs/tetris.git", rev = "583f52585452ab6452bbca2c1cc92f0ea118ddca" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["autotune"]
omit = [
    # Subprocess / MLX / network wrappers are exercised by the smoke run, not unit tests.
    "autotune/rollout.py",
    "autotune/train_sft.py",
    "autotune/generate.py",
    "autotune/loop.py",
    "autotune/experiment.py",
    "autotune/march.py",
    "autotune/tetris_rollout.py",
    "autotune/tetris_package_job.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
